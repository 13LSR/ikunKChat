name = "ikunkchat-ai-proxy"
main = "ai-proxy.js"
compatibility_date = "2024-09-23"
workers_dev = false
preview_urls = false

routes = [
  { pattern = "hjmapi.lsr.kdns.fr", zone_name = "lsr.kdns.fr", custom_domain = true },
]

[triggers]
crons = ["0 3 * * *"]

[[d1_databases]]
binding = "ANALYTICS_DB"
database_name = "ikunkchat-analytics"
database_id = "1ae3dd71-9a53-4f6c-b48d-ce663547240b"
migrations_dir = "migrations"
